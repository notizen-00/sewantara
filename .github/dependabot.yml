version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(ci)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '02:15'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(api)'
    groups:
      php-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '02:30'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(api)'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule:
      interval: weekly
      day: tuesday
      time: '02:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(dashboard)'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/tenant-web
    schedule:
      interval: weekly
      day: tuesday
      time: '02:15'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(tenant-web)'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/landing
    schedule:
      interval: weekly
      day: tuesday
      time: '02:30'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(landing)'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfiles, plus the postgres/redis pins in the
  # production compose file.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/dashboard
      - /apps/tenant-web
      - /apps/landing
      - /deploy
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deploy)'
