# Single-app convenience stack for apps/dashboard.
#
# NOT the production deployment. Production runs every app from one stack:
# deploy/compose.yml (pulls CI-built images, no build on the server).
# Use this only to run or smoke test the dashboard on its own.

name: sewantara-dashboard

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost}
        NUXT_PUBLIC_TENANT_BASE_DOMAIN: ${NUXT_PUBLIC_TENANT_BASE_DOMAIN:-sewantara.id}
    image: sewantara-dashboard:${IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3005
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3005}:3005"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3005/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
