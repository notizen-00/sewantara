# Single-app development stack for apps/tenant-web.
#
# NOT the production deployment — that is deploy/compose.yml, which pulls
# CI-built images for all four apps.

name: sewantara-tenant-web-dev

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "${CONTAINER_PORT:-3000}"
  NUXT_PUBLIC_APP_NAME: "${NUXT_PUBLIC_APP_NAME:-Sewantara}"
  NUXT_PUBLIC_BASE_URL: "${NUXT_PUBLIC_BASE_URL:-https://sewantara.id}"
  NUXT_PUBLIC_BASE_DOMAIN: "${NUXT_PUBLIC_BASE_DOMAIN:-sewantara.id}"
  NUXT_PUBLIC_CDN: "${NUXT_PUBLIC_CDN:-}"
  NUXT_API_BASE: "${NUXT_API_BASE:-https://api.sewantara.id}"
  NUXT_API_TOKEN: "${NUXT_API_TOKEN:-}"
  # Nuxt runtimeConfig memakai nama nested berikut. Nilainya tetap dibaca dari
  # nama environment yang didokumentasikan di .env.example.
  NUXT_API_ENDPOINTS_TENANT: "${NUXT_API_TENANT_ENDPOINT:-/v1/public/tenant}"
  NUXT_API_ENDPOINTS_HOME: "${NUXT_API_HOME_ENDPOINT:-/v1/public/home}"
  NUXT_API_ENDPOINTS_CATALOG: "${NUXT_API_CATALOG_ENDPOINT:-/v1/public/catalog}"
  NUXT_API_ENDPOINTS_QUOTE: "${NUXT_API_QUOTE_ENDPOINT:-/v1/public/bookings/quote}"
  NUXT_API_ENDPOINTS_BOOKINGS: "${NUXT_API_BOOKINGS_ENDPOINT:-/v1/public/bookings}"
  NUXT_API_ENDPOINTS_TRACKING: "${NUXT_API_TRACKING_ENDPOINT:-/v1/public/bookings}"
  NUXT_API_ENDPOINTS_BLOG: "${NUXT_API_BLOG_ENDPOINT:-/v1/public/blog}"
  NUXT_PUBLIC_DEMO_MODE: "${NUXT_PUBLIC_DEMO_MODE:-true}"
  NUXT_PUBLIC_DEMO_TENANT: "${NUXT_PUBLIC_DEMO_TENANT:-kamerajember}"
  NUXT_TRUST_PROXY: "${NUXT_TRUST_PROXY:-false}"
  NUXT_ALLOW_CUSTOM_DOMAINS: "${NUXT_ALLOW_CUSTOM_DOMAINS:-false}"
  NUXT_ROOT_TENANT: "${NUXT_ROOT_TENANT:-}"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: "sewantara-tenant-web:${IMAGE_TAG:-local}"
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${CONTAINER_PORT:-3000}"
    environment: *app-environment
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${CONTAINER_PORT:-3000}/healthz').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    networks:
      - sewantara
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  quality:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    profiles:
      - tools
    environment: *app-environment
    command:
      - sh
      - -c
      - npm run typecheck && npm run lint && npm run test
    networks:
      - sewantara

networks:
  sewantara:
    driver: bridge
